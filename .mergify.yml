# Mergify (https://github.com/apps/mergify) backports merged rolling PRs to the release branches
# when a maintainer adds a label, the way the ROS 2 core repositories do. The release branches
# (humble, jazzy, kilted, lyrical) are created when the package is released into a distro;
# until then the labels simply have no target.
pull_request_rules:
  - name: backport to all release branches at reviewers discretion
    conditions:
      - base=rolling
      - "label=backport-all"
    actions:
      backport:
        branches:
          - lyrical
          - kilted
          - jazzy
          - humble

  - name: backport to lyrical at reviewers discretion
    conditions:
      - base=rolling
      - "label=backport-lyrical"
    actions:
      backport:
        branches:
          - lyrical

  - name: backport to kilted at reviewers discretion
    conditions:
      - base=rolling
      - "label=backport-kilted"
    actions:
      backport:
        branches:
          - kilted

  - name: backport to jazzy at reviewers discretion
    conditions:
      - base=rolling
      - "label=backport-jazzy"
    actions:
      backport:
        branches:
          - jazzy

  - name: backport to humble at reviewers discretion
    conditions:
      - base=rolling
      - "label=backport-humble"
    actions:
      backport:
        branches:
          - humble
