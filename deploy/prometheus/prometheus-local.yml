# Prometheus for one host (README section 4.6): scrapes ros2ebpfd directly,
# no collector, no remote_write, no Alertmanager (the rules still evaluate and show on /alerts).
# Every container of the tutorial runs on the host network, so the daemon is localhost:9477.
# From the repository root:
#
#   docker run -d --name prometheus --network host -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
#     prom/prometheus:v3.5.0 --config.file=/etc/prometheus/prometheus-local.yml
#
# The central setup (prometheus.yml) receives remote_write from the robots instead.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: ros2ebpf
    honor_labels: true                    # keep the exporter's own host label
    static_configs:
      - targets: [localhost:9477]
        labels: {robot: bench-01}         # on a real robot the collector adds this label
