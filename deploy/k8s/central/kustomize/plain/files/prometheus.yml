# Central Prometheus for ros2ebpf. Robots push through remote_write
# (--web.enable-remote-write-receiver); nothing is scraped directly except
# Prometheus itself. Alert rules live in rules/. For one host scraped
# directly (README section 4.6) see prometheus-local.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
