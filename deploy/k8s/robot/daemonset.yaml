# One ros2ebpfd per node. hostPID lets it find ROS 2 processes running as
# pods (through /proc/<pid>/root) or on the node; hostNetwork keeps the
# exporter on the node's :9477 so `instance` stays meaningful.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ros2ebpfd
  namespace: ros2ebpf
  labels: {app: ros2ebpfd}
spec:
  selector:
    matchLabels: {app: ros2ebpfd}
  updateStrategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: ros2ebpfd}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9477"
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists          # run on every node, including control plane
      nodeSelector:
        ros2ebpf/enabled: "true"
      priorityClassName: system-node-critical
      containers:
        - name: ros2ebpfd
          image: ghcr.io/fujitatomoya/ros2ebpfd:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # kernels >= 5.8: these four are enough. Older kernels: privileged: true
            capabilities:
              add: [BPF, PERFMON, SYS_PTRACE, SYS_RESOURCE, SYS_ADMIN]
            # privileged: true
          env:
            - name: ROS2EBPF_HOST
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: metrics, containerPort: 9477, hostPort: 9477}
          volumeMounts:
            - {name: bpffs, mountPath: /sys/fs/bpf}
            - {name: btf, mountPath: /sys/kernel/btf, readOnly: true}
            - {name: machine-id, mountPath: /etc/machine-id, readOnly: true}
            - {name: config, mountPath: /etc/ros2ebpf, readOnly: true}
            - {name: run, mountPath: /run/ros2ebpf}
            # ROS installed on the node itself (not only in pods)? mount it so
            # static shim entries in config.yaml resolve; discovery works without it.
            # - {name: ros, mountPath: /opt/ros, readOnly: true}
          readinessProbe:
            exec: {command: [ros2ebpf-ctl, status, -q]}
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 9477}
            periodSeconds: 60
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - {name: bpffs, hostPath: {path: /sys/fs/bpf, type: Directory}}
        - {name: btf, hostPath: {path: /sys/kernel/btf, type: Directory}}
        - {name: machine-id, hostPath: {path: /etc/machine-id, type: File}}
        - {name: config, configMap: {name: ros2ebpf-config, optional: true}}
        - {name: run, emptyDir: {}}
        # - {name: ros, hostPath: {path: /opt/ros, type: Directory}}
