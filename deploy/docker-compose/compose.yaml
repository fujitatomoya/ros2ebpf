# Bench deployment: one probed host (this machine) + the full pipeline.
#
#   cd deploy/docker-compose
#   cp ros2ebpf/config.example.yaml ros2ebpf/config.yaml     # optional: defaults discover shims automatically
#   docker compose up -d --build
#   docker compose --profile demo up -d demo                  # optional demo nodes in a container
#   docker compose run --rm cli ros2 ebpf status              # CLI through the shared control socket
#   open http://localhost:3000 (Grafana, admin/admin)  http://localhost:9090/alerts
#
# The daemon container needs: host pid namespace (to reach ROS processes on
# the host and in other containers via /proc/<pid>/root), bpffs, BTF, and
# CAP_BPF/PERFMON/SYS_PTRACE (privileged is the simple superset).
name: ros2ebpf

services:
  ros2ebpfd:
    build: {context: ../.., dockerfile: docker/Dockerfile.daemon}
    image: ros2ebpfd:local
    pid: host
    privileged: true            # or: cap_add: [BPF, PERFMON, SYS_PTRACE, SYS_RESOURCE, SYS_ADMIN]
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./ros2ebpf:/etc/ros2ebpf:ro          # config.yaml / expectations.yaml (optional)
      - ros2ebpf-run:/run/ros2ebpf           # control socket, shared with the cli service
    environment:
      ROS2EBPF_HOST: ${ROS2EBPF_HOST:-${HOSTNAME:-bench}}
    ports: ["9477:9477"]
    restart: unless-stopped

  cli:                                       # docker compose run --rm cli ros2 ebpf status
    build: {context: ../.., dockerfile: docker/Dockerfile.cli}
    image: ros2ebpf-cli:local
    volumes: [ros2ebpf-run:/run/ros2ebpf]
    profiles: [tools]

  demo:                                      # talker + listener + add_two_ints in a container
    build: {context: ../.., dockerfile: docker/Dockerfile.demo}
    image: ros2ebpf-demo:local
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    network_mode: host
    profiles: [demo]

  alloy:                                     # per-robot collector; here on the same box
    image: grafana/alloy:v1.6.1
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-wal:/var/lib/alloy
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    environment:
      ROBOT: ${ROBOT:-bench-01}
      SITE: ${SITE:-bench}
      SCRAPE_TARGETS: ${SCRAPE_TARGETS:-ros2ebpfd:9477}
      REMOTE_WRITE_URL: ${REMOTE_WRITE_URL:-http://prometheus:9090/api/v1/write}
    depends_on: [ros2ebpfd, prometheus]
    restart: unless-stopped

  prometheus:                                # "central" for the bench
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: [../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes: {ros2ebpf-run: {}, alloy-wal: {}, prom-data: {}}
