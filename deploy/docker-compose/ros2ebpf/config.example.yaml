# Daemon config for the compose bench. Copy to config.yaml and edit; without
# config.yaml the container generates a minimal one (discovery on).
host: ""                       # "" = kernel hostname (the compose file also sets ROS2EBPF_HOST)
robot: ""                      # set by Alloy's external label instead
shims: []                      # host ROS install? add: - path: /opt/ros/rolling/lib/librmw_implementation.so (and mount /opt/ros:ro)
discover_shims: true           # finds shims in the demo container and on the host via /proc/<pid>/maps
identity: {read_environ: true, default_domain_id: 0}
probes: {publish: true, take: true, services: true, udp_drops: true, seq_gap: [/chatter]}
topics: {exclude: [/parameter_events, /rosout]}
histogram_buckets_seconds: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.5, 1]
exporter: {mode: inprocess, listen: 0.0.0.0:9477, rmw_label: false}
control: {socket: /run/ros2ebpf/control.sock, http: ""}
expectations_file: /etc/ros2ebpf/expectations.yaml
log_level: info
