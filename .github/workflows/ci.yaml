# ros2ebpf follows ROS 2 rolling only (fujitatomoya/ros2ebpf#8): every job builds and tests
# against rolling. Distro branches and their workflows are added when a release is branched.
name: ci
on:
  push:
    branches: [rolling]
  pull_request:
    branches: [rolling]
  workflow_dispatch:

env:
  ROS_DISTRO: rolling

jobs:
  rolling:
    name: rolling source build (colcon build + test, offsets vs mainline rmw, BPF verifier, deb)
    runs-on: ubuntu-latest
    container:
      image: tomoyafujita/ros2dev:rolling
      options: --privileged   # bpffs mount + BPF program load for the verifier check
      env:
        ROS_DISTRO: rolling
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build and test with ROS rolling
        shell: bash
        run: |
          ./scripts/github_workflows.sh

  images:
    name: container images + end-to-end (rolling binaries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the daemon, CLI and demo images and run scripts/e2e.sh
        run: |
          sudo mount -t bpf bpf /sys/fs/bpf || true
          make e2e
      - name: CLI image smoke test
        run: docker run --rm ros2ebpf-cli:local ros2 ebpf --help

  deploy-lint:
    name: deploy manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/rules/ros2.yaml
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
      - name: amtool check config
        run: docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /p/alertmanager.yml
      - name: kustomize build
        run: |
          make k8s-sync && git diff --exit-code -- deploy/k8s   # synced copies must be committed
          docker run --rm -v "$PWD/deploy:/d:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /d/k8s/robot > /dev/null
          docker run --rm -v "$PWD/deploy:/d:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /d/k8s/central/kustomize/plain > /dev/null
      - name: compose config
        run: docker compose -f deploy/docker-compose/compose.yaml config > /dev/null
      - name: alloy fmt
        run: docker run --rm -v "$PWD/deploy/docker-compose/alloy:/a:ro" grafana/alloy:v1.6.1 fmt /a/config.alloy > /dev/null
