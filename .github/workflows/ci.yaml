# ros2ebpf follows ROS 2 rolling only (fujitatomoya/ros2ebpf#8): every job builds and tests
# against rolling. Distro branches and their workflows are added when a release is branched.
name: ci
on:
  push:
    branches: [rolling]
  pull_request:
    branches: [rolling]
  workflow_dispatch:

jobs:
  rolling:
    name: rolling source build (colcon build + test, offsets vs mainline rmw, daemon + CLI + end-to-end on mainline)
    runs-on: ubuntu-latest
    container:
      image: tomoyafujita/ros2dev:rolling
      # privileged: bpffs mount + BPF program load. pid=host: the BPF programs report host-namespace
      # pids, which the daemon resolves through /proc (same requirement as a containerised deployment).
      options: --privileged --pid=host
      env:
        ROS_DISTRO: rolling
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build and test with ROS rolling
        shell: bash
        run: |
          ./scripts/github_workflows.sh

  images:
    name: container images (rolling binaries) + cross-container discovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the daemon, CLI and demo images
        run: |
          docker build -f docker/Dockerfile.daemon -t ros2ebpfd:ci .
          docker build -f docker/Dockerfile.cli -t ros2ebpf-cli:ci .
          docker build -f docker/Dockerfile.demo -t ros2ebpf-demo:ci .
          docker run --rm ros2ebpf-cli:ci ros2 ebpf --help
      - name: Daemon in its own container discovers the demo container's shim
        run: |
          sudo mount -t bpf bpf /sys/fs/bpf || true
          docker run -d --name r2e-demo --network host -e ROS_DOMAIN_ID=5 ros2ebpf-demo:ci
          docker run -d --name r2e-daemon --pid host --privileged \
            -v /sys/fs/bpf:/sys/fs/bpf -v /sys/kernel/btf:/sys/kernel/btf:ro -e ROS2EBPF_HOST=ci ros2ebpfd:ci
          for i in $(seq 1 30); do docker exec r2e-daemon ros2ebpf-ctl status -q >/dev/null 2>&1 && break; sleep 1; done
          docker logs r2e-daemon
          docker exec r2e-daemon ros2ebpf-ctl status -q
          sleep 5
          docker exec r2e-daemon ros2ebpf-ctl metrics | grep -E '^ros2(ebpf_host_info|_rmw_publish_total)\{' | tee /tmp/metrics.txt
          grep -E '^ros2_rmw_publish_total\{host="ci",domain_id="5",comm="talker",topic="/chatter"\} [1-9]' /tmp/metrics.txt
          grep -E '^ros2ebpf_host_info\{.*shim_path="/proc/[0-9]+/root/opt/ros/rolling/.*offset_table="rolling/' /tmp/metrics.txt
          docker rm -f r2e-demo r2e-daemon

  deploy-lint:
    name: deploy manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: synced copies under deploy/k8s must be committed
        run: sh deploy/k8s/sync.sh && git diff --exit-code -- deploy/k8s
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/rules/ros2.yaml
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
      - name: amtool check config
        run: docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /p/alertmanager.yml
      - name: kustomize build
        run: |
          docker run --rm -v "$PWD/deploy:/d:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /d/k8s/robot > /dev/null
          docker run --rm -v "$PWD/deploy:/d:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /d/k8s/central/kustomize/plain > /dev/null
      - name: alloy fmt
        run: docker run --rm -v "$PWD/deploy/alloy:/a:ro" grafana/alloy:v1.6.1 fmt /a/config.alloy > /dev/null
