# ros2ebpf follows ROS 2 rolling only (fujitatomoya/ros2ebpf#8, #15): every job builds and tests
# against rolling, on Ubuntu 26.04 containers. A distro branch and its workflow are created when
# the next ROS release is branched.
name: ci
on:
  push:
    branches: [rolling]
  pull_request:
    branches: [rolling]
  workflow_dispatch:

jobs:
  rolling:
    name: rolling source build (colcon build + test, offsets vs mainline rmw, daemon + CLI + end-to-end on mainline)
    runs-on: ubuntu-latest
    container:
      image: tomoyafujita/ros2dev:rolling
      # privileged: bpffs mount + BPF program load. pid=host: the BPF programs report host-namespace
      # pids, which the daemon resolves through /proc (same requirement as a containerised deployment).
      options: --privileged --pid=host
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build and test with ROS rolling
        shell: bash
        run: |
          ./scripts/github_workflows.sh

  arm64:
    # The same script on an aarch64 kernel: BPF objects through the arm64 verifier, uprobes on the
    # arm64 librmw_implementation.so, the aarch64 offset rows against mainline, and the end-to-end
    # test. ros2dev is amd64 only, so the job runs in ros:<distro>-ros-base and installs the build
    # dependencies with rosdep (ROS2EBPF_CI_ROSDEP=1).
    name: arm64 rolling source build (same as above, on an aarch64 runner)
    runs-on: ubuntu-24.04-arm
    container:
      image: ros:rolling-ros-base
      options: --privileged --pid=host
    env:
      ROS2EBPF_CI_ROSDEP: 1
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build and test with ROS rolling on aarch64
        shell: bash
        run: |
          ./scripts/github_workflows.sh

  offsets-aarch64:
    # A quick check of the aarch64 rows of src/offsets.c against the rmw headers of the arm64
    # ros:<distro>-ros-base image under qemu-user (struct offsets only, no BPF), next to the arm64 job.
    name: aarch64 offsets vs released binaries (qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: scripts/check_offsets_arch.sh aarch64
        run: ./scripts/check_offsets_arch.sh aarch64

  deploy-lint:
    name: deploy manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: synced copies under deploy/k8s must be committed
        run: sh deploy/k8s/sync.sh && git diff --exit-code -- deploy/k8s
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/rules/ros2.yaml
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus-local.yml
      - name: amtool check config
        run: docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /p/alertmanager.yml
      - name: kustomize build
        run: |
          docker run --rm -v "$PWD/deploy:/d:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /d/k8s/robot > /dev/null
          docker run --rm -v "$PWD/deploy:/d:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /d/k8s/central/kustomize/plain > /dev/null
      - name: alloy fmt
        run: docker run --rm -v "$PWD/deploy/alloy:/a:ro" grafana/alloy:v1.6.1 fmt /a/config.alloy > /dev/null
      - name: ros2ebpfd image of the DaemonSet builds (docker/Dockerfile, rolling binaries)
        run: |
          docker build -f docker/Dockerfile -t ros2ebpfd:ci .
          docker run --rm --entrypoint ros2ebpfd ros2ebpfd:ci --version
